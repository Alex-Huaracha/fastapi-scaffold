services:
  db-test:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_test_data:/var/lib/postgresql

volumes:
  postgres_test_data: