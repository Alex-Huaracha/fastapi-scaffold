name: fastapi-scaffold-test

services:
  test:
    build: .
    command: uv run pytest -v
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/postgres_db_test
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_test_data:/var/lib/postgresql

volumes:
  postgres_test_data: